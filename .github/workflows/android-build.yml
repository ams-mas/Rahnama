name: Android debug APK

on:
  push:
    branches: [android-apk-foundation]
  pull_request:
    branches: [android-apk-foundation]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Make Gradle wrapper if not present
        run: |
          if [ ! -f gradlew ]; then
            echo "Gradle wrapper is not included yet. Add wrapper files from Android Studio before using this workflow."
            exit 1
          fi
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rahnama-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
